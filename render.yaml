# Render blueprint — free tier.
# Create the service from the Render dashboard: New > Blueprint > pick this repo.
services:
  - type: web
    name: ai-virtual-studio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: USE_CELERY
        value: "False"
      # Postgres (free instance below). Render injects the connection string.
      - key: DATABASE_URL
        fromDatabase:
          name: ai-virtual-studio-db
          property: connectionString
      # Set these in the Render dashboard (marked sync:false = you fill them in):
      - key: FRONTEND_ORIGIN
        sync: false          # https://<your-app>.vercel.app
      - key: IMAGE_AI_PROVIDER
        sync: false          # replicate | gemini | mock
      - key: IMAGE_AI_API_KEY
        sync: false          # Replicate token
      - key: IMAGE_AI_MODEL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false          # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: auto

databases:
  - name: ai-virtual-studio-db
    plan: free
    databaseName: studio
    user: studio
